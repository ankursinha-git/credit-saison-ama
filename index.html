// ═══ FIX #1: ROBUST INTENT DETECTION with fuzzy matching ═══
const INTENT_PATTERNS = {
  agent_credit_score: [
    /\b(check|see|show|get|fetch|pull|know|find|view|whats|what'?s)\b.*(credit|cibil|experian|score|report)/i,
    /\b(credit|cibil|experian)\b.*(score|report|check|rating|number)/i,
    /\bmy\s*score\b/i, /\bcredit\s*report\b/i, /\bscore\s*check\b/i,
    /\bhow\s*(much|good|bad)\s*(is)?\s*my\s*(credit|cibil|score)/i,
    /\bcibil\b/i, // standalone "cibil" = always credit score agent
  ],
  agent_pfm: [
    /\b(spend|saving|expense|income|money|financial)\s*(insight|pattern|habit|health|analy|track|manage|breakdown)/i,
    /\b(bank|account)\s*(aggregat|link|connect|data|statement|insight)/i,
    /\b(analy[sz]e|understand|track)\s*(my)?\s*(spend|money|financ|expense|income|saving)/i,
    /\bpfm\b/i, /\bfinsight/i, /\baa\s*consent/i,
    /\b(where|how)\s*(does|is|do)\s*(my)?\s*money\s*(go|going|spent)/i,
    /\bbudget/i, /\bspending\s*(pattern|habit|breakdown)/i,
  ],
  agent_bbps: [
    /\b(pay|recharge|top.?up)\s*(my|the|a)?\s*(bill|electric|mobile|dth|broadband|phone|wifi|gas|water)/i,
    /\bbill\s*(pay|payment)/i, /\bbbps\b/i, /\brecharge\b/i,
    /\b(electric|electricity|power|bijli)\s*(bill)?/i,
    /\b(mobile|phone|prepaid|postpaid)\s*(recharge|bill|top.?up)/i,
    /\b(dth|dish|tata\s*play|airtel\s*digital)/i,
    /\b(broadband|wifi|internet)\s*(bill|pay|recharge)/i,
  ]
};

function detectIntent(text) {
  const t = text.trim();
  // Check each agent pattern set, return first match
  for (const [intent, patterns] of Object.entries(INTENT_PATTERNS)) {
    for (const regex of patterns) {
      if (regex.test(t)) return intent;
    }
  }
  return "ama";
}

// ═══ FIX #2 + #3: BETTER ANSWERS + CONTEXT-AWARE RESPONSES ═══
// Context-aware response generator (uses session memory)
function getResponse(text, memory) {
  const lower = text.toLowerCase();

  // ═══ PFM DATA QUERY LAYER — answer spending/income questions from bank data ═══
  if (memory.pfmData) {
    const p = memory.pfmData;
    const catMap = {};
    p.categories.forEach(c => { catMap[c.name.toLowerCase()] = c; });

    // Category-specific spending queries
    const spendingPatterns = [
      { match: /emi|loan|installment/, cat: "emis & loans" },
      { match: /rent|utilit|electric|water|gas|maintenance/, cat: "rent & utilities" },
      { match: /food|din(ing|e|ner)|restaurant|eat|zomato|swiggy|meal|lunch|breakfast/, cat: "food & dining" },
      { match: /shop|cloth|amazon|flipkart|buy|purchase|retail/, cat: "shopping" },
      { match: /other|misc|remain/, cat: "others" },
    ];

    // Check if this is a spending query
    const isSpendingQ = lower.match(/spend|spent|spending|expense|expens|cost|how\s*much|monthly|pay(ing|ment)?|budget|where.*money|money.*go/);
    const isIncomeQ = lower.match(/income|earn|salary|credit|inflow|receiv/);
    const isSavingsQ = lower.match(/sav(e|ing|ed)|left\s*over|surplus|remaining|balance/);
    const isSummaryQ = lower.match(/summary|overview|total|overall|breakd?own|full\s*picture|financial\s*(health|status|position)/);

    if (isSpendingQ || isIncomeQ || isSavingsQ || isSummaryQ) {
      // Find which category they're asking about
      let matchedCat = null;
      for (const { match, cat } of spendingPatterns) {
        if (match.test(lower)) { matchedCat = catMap[cat]; break; }
      }

      if (matchedCat && isSpendingQ) {
        const monthlyAmt = matchedCat.amount;
        const pctOfIncome = Math.round((monthlyAmt / p.income) * 100);
        const pctOfSpend = matchedCat.pct;
        const isHigh = pctOfSpend > 25;
        var highMsg = isHigh
          ? (matchedCat.name === "EMIs & Loans" ? "This is a significant portion of your budget. If you're considering a new loan, factor this in -- your current EMI burden is already at " + pctOfIncome + "% of income." : "This is a significant portion of your budget. You might want to review this category for potential savings.")
          : (matchedCat.name === "Food & Dining" ? "This looks reasonable relative to your income. The average Indian urban household spends about 15-20% on food, so you're right in that range." : "This looks reasonable relative to your income.");
        return {
          text: "Based on your bank data (" + p.period + "):\n\n" + matchedCat.name + ": Rs." + (monthlyAmt/1000).toFixed(0) + "K/month\n\nThis is " + pctOfSpend + "% of your total spending and " + pctOfIncome + "% of your monthly income (Rs." + (p.income/1000).toFixed(0) + "K).\n\n" + highMsg,
          followUp: ["What is my total monthly spending?", "How much am I saving?", "Can I afford another EMI?"],
          cta: { text: "Open Finsights", action: "open_finsights" }
        };
      }

      if (isIncomeQ) {
        return {
          text: `From your bank data (${p.period}):\n\n📈 Monthly Income: ₹${(p.income/1000).toFixed(0)}K\n📉 Monthly Spending: ₹${(p.spending/1000).toFixed(0)}K\n💪 Net Savings: ₹${(p.savings/1000).toFixed(0)}K (${p.savingsRate}% savings rate)\n\nYour income-to-expense ratio is healthy. ${p.savingsRate > 20 ? "You're saving more than the national average of 18%." : "The national average savings rate is 18%, so there's room to optimize."}`,
          followUp: ["What am I spending most on?", "Can I afford a new EMI?", "How can I save more?"],
          cta: { text: "Open Finsights", action: "open_finsights" }
        };
      }

      if (isSavingsQ) {
        var breakdownLines = p.categories.map(function(c) { return "- " + c.name + ": Rs." + (c.amount/1000).toFixed(0) + "K (" + c.pct + "%)"; }).join("\n");
        var savingsAdvice = p.savingsRate >= 25 ? "Your savings rate is excellent. You have a strong financial cushion." : p.savingsRate >= 18 ? "Your savings rate is above average. Consider automating investments to build wealth faster." : "Your savings rate is below the 18% national average. Look at your top 2 spending categories for optimization opportunities.";
        return {
          text: "From your bank data (" + p.period + "):\n\nYou're saving Rs." + (p.savings/1000).toFixed(0) + "K per month (" + p.savingsRate + "% of income).\n\nBreakdown of where your Rs." + (p.spending/1000).toFixed(0) + "K monthly spending goes:\n" + breakdownLines + "\n\n" + savingsAdvice,
          followUp: ["How much do I spend on food?", "What is my EMI burden?", "Can I afford another loan?"],
          cta: { text: "Open Finsights", action: "open_finsights" }
        };
      }

      if (isSummaryQ || (isSpendingQ && !matchedCat)) {
        var summaryLines = p.categories.map(function(c) { return "- " + c.name + ": Rs." + (c.amount/1000).toFixed(0) + "K (" + c.pct + "%)"; }).join("\n");
        var biggestNote = p.categories[0].pct > 30 ? "This is a significant portion -- worth reviewing if you're looking to optimize." : "This is within a reasonable range.";
        return {
          text: "Here's your financial summary (" + p.period + "):\n\nIncome: Rs." + (p.income/1000).toFixed(0) + "K/month\nSpending: Rs." + (p.spending/1000).toFixed(0) + "K/month\nSavings: Rs." + (p.savings/1000).toFixed(0) + "K/month (" + p.savingsRate + "%)\n\nSpending breakdown:\n" + summaryLines + "\n\nYour biggest expense is " + p.categories[0].name + " at Rs." + (p.categories[0].amount/1000).toFixed(0) + "K/month. " + biggestNote,
          followUp: ["How much did I spend on food?", "What is my EMI burden?", "Can I afford another EMI?"],
          cta: { text: "Open Finsights", action: "open_finsights" }
        };
      }
    }

    // "Can I afford" / "additional EMI" queries
    if (lower.match(/afford|can\s*i\s*take|additional\s*emi|more\s*emi|new\s*(loan|emi)|capacity|headroom/)) {
      const emiCat = catMap["emis & loans"];
      const currentEmi = emiCat ? emiCat.amount : 0;
      const maxEmi = Math.round(p.income * 0.4);
      const headroom = maxEmi - currentEmi;
      const canAfford = headroom > 5000;
      var affordMsg = canAfford
        ? "Yes, you can comfortably take on an additional EMI of up to Rs." + (headroom/1000).toFixed(0) + "K/month.\n\nAt 16% interest over 36 months, that translates to roughly Rs." + Math.round(headroom*28/1000) + "K loan amount.\nAt 10% (LAP rate) over 10 years, that's roughly Rs." + Math.round(headroom*78/1000) + "K."
        : "Your current EMI burden is close to the safe limit. I'd recommend reducing existing obligations before taking a new loan, or consider a longer tenure to keep EMIs low.";
      return {
        text: "Based on your financial data:\n\nCurrent EMIs: Rs." + (currentEmi/1000).toFixed(0) + "K/month (" + Math.round(currentEmi/p.income*100) + "% of income)\nSafe limit (40% rule): Rs." + (maxEmi/1000).toFixed(0) + "K/month\nAvailable headroom: Rs." + (headroom/1000).toFixed(0) + "K/month\n\n" + affordMsg,
        followUp: ["What types of business loans does Credit Saison offer?", "What is the interest rate for LAP?"],
        cta: canAfford ? { text: "Explore Loan Options", action: "apply" } : null
      };
    }

    // "How can I save more" query
    if (lower.match(/save\s*more|reduce\s*spend|cut\s*(cost|expens|spend)|optimi[sz]e/)) {
      const sorted = [...p.categories].sort((a, b) => b.amount - a.amount);
      var tip1 = sorted[0].name === "EMIs & Loans" ? "Consider refinancing at lower rates or making prepayments to reduce interest." : sorted[0].name === "Rent & Utilities" ? "Utility bills can be optimized. Rent is harder to change short-term." : "Look for 10-15% reduction opportunities here for maximum impact.";
      var tip2 = sorted[1].name === "Food & Dining" ? "Cooking more at home and reducing food delivery could save Rs.5-8K/month." : "Review for subscriptions or recurring charges you might not need.";
      var tip3 = sorted[2].name === "Shopping" ? "Try a 24-hour rule before non-essential purchases." : "Small optimizations here add up.";
      return {
        text: "Here are actionable ways to save more based on your spending data:\n\n1. " + sorted[0].name + " (Rs." + (sorted[0].amount/1000).toFixed(0) + "K) -- Your biggest expense. " + tip1 + "\n\n2. " + sorted[1].name + " (Rs." + (sorted[1].amount/1000).toFixed(0) + "K) -- " + tip2 + "\n\n3. " + sorted[2].name + " (Rs." + (sorted[2].amount/1000).toFixed(0) + "K) -- " + tip3 + "\n\nA realistic target: Save an additional Rs.8-12K/month by optimizing your top 2 categories.",
        followUp: ["What is my total monthly spending?", "Can I afford a new EMI?"],
        cta: { text: "Open Finsights", action: "open_finsights" }
      };
    }
  }

  // If no PFM data but user is asking about spending
  if (!memory.pfmData && lower.match(/spend|spent|income|saving|my\s*money|my\s*expense|my\s*emi\s*burden|afford/)) {
    return {
      text: "I'd need your bank data to answer that accurately. I can connect to your bank account securely via Account Aggregator to analyze your spending, income, and savings.\n\nIt takes about 2 minutes and your data is fully encrypted.",
      followUp: [],
      cta: { text: "Link Bank Account", action: "trigger_pfm_agent" }
    };
  }
  // Exact match first
  if (AI_RESPONSES[text]) {
    const r = { ...AI_RESPONSES[text] };
    // FIX #4: If user has score in memory, personalize credit-related answers
    if (memory.creditScore && text.toLowerCase().includes("improve")) {
      const s = memory.creditScore;
      r.text = `Based on your current Experian score of ${s.score} (${s.rating}), here's a personalized improvement plan:\n\n`;
      if (s.score < 700) {
        r.text += "Your score needs significant work. Priority actions:\n\n1. Clear any overdue payments immediately — this is pulling your score down the most\n2. Reduce credit card utilization below 30% within the next 30 days\n3. Avoid any new loan applications for at least 6 months\n4. Set up auto-pay for all existing EMIs\n\nTimeline: Expect 40-60 point improvement in 3-4 months with consistent behavior.";
      } else if (s.score < 750) {
        r.text += "You're in the Good range but close to Excellent. Focus areas:\n\n1. Your recent hard inquiry (1 month ago) will age out in 6 months — avoid new applications\n2. Reduce active accounts from 7 to 4-5 by closing unused ones (keep the oldest)\n3. Maintain on-time payments (you're at 98%, push for 100%)\n4. Keep utilization at current 22% or lower\n\nTimeline: You could cross 800 in 4-6 months.";
      } else {
        r.text += "Your score of " + s.score + " is already excellent. To maintain it:\n\n1. Continue 100% on-time payments\n2. Keep credit utilization below 25%\n3. Don't close your oldest credit account\n4. Limit hard inquiries to 1-2 per year\n\nYou're in great shape for the best loan rates available.";
      }
      r.followUp = ["What CIBIL score do I need for a business loan?", "What types of business loans does Credit Saison offer?"];
    }
    // Personalize eligibility answers with score
    if (memory.creditScore && (text.toLowerCase().includes("eligib") || text.toLowerCase().includes("cibil score do i need"))) {
      const s = memory.creditScore.score;
      r.text += `\n\n📊 Based on your current score of ${s}: ${s >= 750 ? "You meet the ideal criteria. You're likely to get faster approval and better rates." : s >= 650 ? "You meet the minimum criteria. You may qualify, though a higher score would get you better terms." : "Your score is below the typical minimum. Consider improving it first, or we can assess your full profile including business financials."}`;
    }
    // Personalize with PFM data
    if (memory.pfmData && text.toLowerCase().includes("loan")) {
      const p = memory.pfmData;
      const emiBurden = Math.round((p.categories[0].amount / p.income) * 100);
      r.text += `\n\n💡 From your financial profile: Your current EMI burden is ${emiBurden}% of income. ${emiBurden < 30 ? "You have healthy headroom for additional EMIs." : emiBurden < 40 ? "You're within acceptable range but approaching the upper limit." : "This is on the higher side. Consider clearing existing obligations first."}`;
    }
    return r;
  }

  // ═══ FIX #2: FUZZY MATCHING — find closest question ═══
  const keywords = lower.split(/\s+/).filter(w => w.length > 2);
  let bestMatch = null, bestScore = 0;
  
  Object.values(QB).forEach(cat => {
    cat.questions.forEach(({ q }) => {
      const ql = q.toLowerCase();
      let score = 0;
      keywords.forEach(kw => { if (ql.includes(kw)) score += 1; });
      // Bonus for key financial terms
      if (lower.includes("emi") && ql.includes("emi")) score += 2;
      if (lower.includes("interest") && ql.includes("interest")) score += 2;
      if (lower.includes("loan") && ql.includes("loan")) score += 1;
      if (lower.includes("prepay") && ql.includes("prepay")) score += 2;
      if (lower.includes("document") && ql.includes("document")) score += 2;
      if (score > bestScore) { bestScore = score; bestMatch = q; }
    });
  });

  if (bestScore >= 2 && AI_RESPONSES[bestMatch]) {
    return AI_RESPONSES[bestMatch];
  }

  // ═══ FIX #2: SMART FALLBACK instead of "talk to advisor" ═══
  // Categorize the unknown question and give a useful response
  if (lower.match(/eligib|qualify|can\s*i\s*get|am\s*i\s*eligible/)) {
    return {
      text: "Eligibility depends on a few key factors:\n\n• Credit Score: 650+ for business loans, varies for LAP\n• Business Vintage: Typically 2+ years (some exceptions for strong profiles)\n• Annual Turnover: Varies by loan amount\n• KYC Documents: PAN, Aadhaar, business proof\n\nThe fastest way to check is to run a quick eligibility check right here in the app. It takes under 2 minutes and won't affect your credit score.",

          {m.pfmCard&&(()=>{const p=m.pfmCard;return <div style={{ marginLeft:27,marginTop:5,background:"#fff",border:"1px solid #E2E8F0",borderRadius:13,padding:"12px",width:"calc(100% - 32px)",boxShadow:"0 2px 5px rgba(0,0,0,.04)" }}>
            <div style={{ fontSize:9,color:"#94A3B8",fontWeight:600,marginBottom:6 }}>{p.period}</div>
            <div style={{ display:"flex",justifyContent:"space-between",marginBottom:10 }}>{[{l:"Income",v:p.income,c:"#2E7D32"},{l:"Spending",v:p.spending,c:"#C62828"},{l:"Savings",v:p.savings,c:"#1565C0"}].map((x,xi)=><div key={xi} style={{ textAlign:"center" }}><div style={{ fontSize:8.5,color:"#94A3B8",fontWeight:600 }}>{x.l}</div><div style={{ fontSize:14,fontWeight:700,color:x.c }}>₹{(x.v/1000).toFixed(0)}K</div></div>)}</div>
            <div style={{ fontSize:10,fontWeight:700,color:"#0A1F44",marginBottom:5 }}>Spending</div>
            {p.categories.map((c,ci)=><div key={ci} style={{ marginBottom:5 }}><div style={{ display:"flex",justifyContent:"space-between",fontSize:9.5,marginBottom:2 }}><span style={{ color:"#334155" }}>{c.name}</span><span style={{ color:"#64748B" }}>₹{(c.amount/1000).toFixed(0)}K ({c.pct}%)</span></div><div style={{ height:5,background:"#F1F5F9",borderRadius:3 }}><div style={{ height:"100%",background:c.color,borderRadius:3,width:`${c.pct}%`,transition:"width 1s ease-out" }}/></div></div>)}
          </div>;})()}

          {m.otpInput&&<div style={{ marginLeft:27,marginTop:5,background:"#fff",border:"1px solid #E2E8F0",borderRadius:13,padding:"14px 12px",width:"calc(100% - 32px)" }}>
            <div style={{ display:"flex",alignItems:"center",gap:5,marginBottom:8 }}><span style={{ fontSize:16 }}>🔐</span><span style={{ fontSize:11,fontWeight:700,color:"#0A1F44" }}>OTP Verification</span></div>
            <div style={{ fontSize:10.5,color:"#475569",lineHeight:1.5,marginBottom:8 }}>{m.otpInput.message}</div>
            <div style={{ display:"flex",gap:4,marginBottom:6 }}>{[1,2,3,4,5,6].map(n=><div key={n} style={{ width:32,height:36,borderRadius:7,border:"1.5px solid #CBD5E1",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:700,color:"#0A1F44",background:"#F8FAFB" }}>•</div>)}</div>
            <div style={{ fontSize:9,color:"#94A3B8" }}>Enter the 6-digit code sent to your phone</div>
          </div>}

          {m.billCard&&(()=>{const b=m.billCard;return <div style={{ marginLeft:27,marginTop:5,background:"#fff",border:"1px solid #E2E8F0",borderRadius:11,padding:"11px 12px",width:"calc(100% - 32px)" }}>
            <div style={{ display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4 }}><div style={{ fontSize:12,fontWeight:700,color:"#0A1F44" }}>{b.biller}</div><div style={{ fontSize:16,fontWeight:700,color:"#0A1F44" }}>₹{b.amount}</div></div>
            <div style={{ fontSize:10,color:"#64748B" }}>{b.detail}</div><div style={{ fontSize:9,color:"#94A3B8",marginTop:1 }}>A/C: {b.accountId}</div>
          </div>;})()}

          {m.successCard&&(()=>{const s=m.successCard;return <div style={{ marginLeft:27,marginTop:5,background:"linear-gradient(135deg,#E8F5E9,#C8E6C9)",border:"1px solid #A5D6A7",borderRadius:11,padding:"12px",width:"calc(100% - 32px)",textAlign:"center" }}>
            <div style={{ fontSize:26,marginBottom:3 }}>✅</div><div style={{ fontSize:13,fontWeight:700,color:"#1B5E20" }}>{s.title}</div>
            <div style={{ fontSize:10.5,color:"#2E7D32",marginTop:2 }}>₹{s.amount} paid to {s.biller}</div><div style={{ fontSize:8,color:"#64748B",marginTop:3,fontFamily:"monospace" }}>Txn: {s.txnId}</div>
          </div>;})()}

          {m.agentButtons&&<div style={{ marginLeft:27,marginTop:5,display:"flex",flexWrap:"wrap",gap:4 }}>
            {m.agentButtons.map((b,bi)=><button key={bi} onClick={()=>btn(b.action)} style={{ background:b.style==="primary"?"linear-gradient(135deg,#2E7D32,#43A047)":b.style==="outline"?"#fff":"#F1F5F9",color:b.style==="primary"?"#fff":"#334155",border:b.style==="primary"?"none":"1px solid #E2E8F0",borderRadius:8,padding:"7px 11px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:F,boxShadow:b.style==="primary"?"0 2px 5px rgba(46,125,50,.2)":"none" }}>{b.label}</button>)}
          </div>}

          {m.cta&&<div style={{ marginLeft:27,marginTop:5 }}><button onClick={()=>btn(m.cta.action||m.cta.text)} style={{ background:"linear-gradient(135deg,#2E7D32,#43A047)",color:"#fff",border:"none",borderRadius:8,padding:"7px 13px",fontSize:11,fontWeight:600,cursor:"pointer",display:"flex",alignItems:"center",gap:4,boxShadow:"0 2px 5px rgba(46,125,50,.2)",fontFamily:F }}>{m.cta.text} <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2.5 5h5M5.5 3l2 2-2 2" stroke="#fff" strokeWidth="1.2" strokeLinecap="round" strokeLinejoin="round"/></svg></button></div>}

          {m.followUp?.length>0&&<div style={{ marginLeft:27,marginTop:5,display:"flex",flexDirection:"column",gap:3 }}>
            <span style={{ fontSize:9,color:"#94A3B8",fontWeight:600 }}>{m.clarifying?"Try these:":"Related"}</span>
            {m.followUp.map((f,fi)=><button key={fi} onClick={()=>send(f)} style={{ background:"#F1F5F9",border:"1px solid #E2E8F0",borderRadius:7,padding:"6px 9px",cursor:"pointer",textAlign:"left",fontSize:11,color:"#334155",fontWeight:500,display:"flex",alignItems:"center",gap:4,fontFamily:F }}><span style={{ color:"#2E7D32" }}>→</span>{f}</button>)}
          </div>}

          {m.topicQuestions?.length>0&&<div style={{ marginLeft:27,marginTop:5,display:"flex",flexDirection:"column",gap:3 }}>
            <div style={{ display:"flex",alignItems:"center",gap:4 }}><span style={{ fontSize:12 }}>{m.topicIcon}</span><span style={{ fontSize:10.5,fontWeight:700,color:"#0A1F44" }}>{m.topicName}</span><span style={{ fontSize:8.5,color:"#94A3B8" }}>{m.topicQuestions.length}q</span></div>
            <div style={{ display:"flex",flexDirection:"column",gap:3,maxHeight:240,overflowY:"auto" }}>
              {m.topicQuestions.map((tq,ti)=><button key={ti} onClick={()=>send(tq)} style={{ background:"#fff",border:"1px solid #E2E8F0",borderRadius:7,padding:"6px 9px",cursor:"pointer",textAlign:"left",fontSize:11,color:"#334155",fontWeight:500,display:"flex",alignItems:"center",gap:5,fontFamily:F,animation:`fu .2s ease-out ${ti*.02}s both` }}>
                <span style={{ width:17,height:17,borderRadius:4,background:"#F1F5F9",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:"#64748B",fontWeight:600,flexShrink:0 }}>{ti+1}</span><span style={{ lineHeight:1.3 }}>{tq}</span>
              </button>)}
            </div>
          </div>}

          <div style={{ fontSize:8,color:"#CBD5E1",marginTop:2,marginLeft:m.role==="ai"?27:0 }}>{new Date(m.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</div>
        </div>)}
        {typing&&<TypingDots/>}
        {loadTxt&&<Loader text={loadTxt}/>}
        <div ref={ref}/>
      </div>

      {sugs.length>0&&inp.length>=2&&<div style={{ background:"#fff",borderTop:"1px solid #E2E8F0",maxHeight:110,overflowY:"auto" }}>
        {sugs.map((s,i)=><button key={i} onClick={()=>{setInp("");send(s);}} style={{ width:"100%",background:"none",border:"none",borderBottom:"1px solid #F1F5F9",padding:"7px 12px",cursor:"pointer",textAlign:"left",fontSize:11.5,color:"#334155",fontFamily:F,display:"flex",alignItems:"center",gap:5 }}><svg width="10" height="10" viewBox="0 0 10 10" fill="none"><circle cx="4.5" cy="4.5" r="3" stroke="#94A3B8" strokeWidth="1"/><path d="M7 7l2.5 2.5" stroke="#94A3B8" strokeWidth="1" strokeLinecap="round"/></svg>{s}</button>)}
      </div>}

      <div style={{ flexShrink:0,background:"#fff",borderTop:"1px solid #E2E8F0",padding:"6px 10px 24px" }}>
        <div style={{ display:"flex",alignItems:"center",gap:6,background:inpOff?"#F8FAFB":"#F1F5F9",borderRadius:11,padding:"3px 5px 3px 12px" }}>
          <input value={inp} onChange={e=>setInp(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")send(inp);}} placeholder={ph} disabled={inpOff} style={{ flex:1,background:"none",border:"none",outline:"none",fontSize:12.5,color:"#1E293B",fontFamily:F,padding:"8px 0",opacity:inpOff?.5:1 }}/>
          <button onClick={()=>send(inp)} disabled={!inp.trim()||inpOff} style={{ width:32,height:32,borderRadius:8,background:inp.trim()&&!inpOff?"linear-gradient(135deg,#0A1F44,#1A3C6E)":"#CBD5E1",border:"none",cursor:inp.trim()&&!inpOff?"pointer":"default",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0 }}>
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2 11l9-4.5L2 2v3.5l5 1-5 1V11z" fill="#fff"/></svg>
          </button>
        </div>
        <div style={{ fontSize:8,color:"#CBD5E1",textAlign:"center",marginTop:4 }}>AI-powered. Verify before financial decisions.</div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>

<script>
// Compile and execute JSX at runtime
window.onerror = function(msg, url, line, col, err) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.innerHTML += '<b>Runtime Error:</b> ' + msg + ' (line ' + line + ')' + '<br>';
};

try {
  var jsxCode = document.getElementById('jsx-source').textContent;
  var output = Babel.transform(jsxCode, { 
    presets: ['react'],
    filename: 'app.jsx'
  });
  var fn = new Function(output.code);
  fn();
} catch(e) {
  var el = document.getElementById('err');
  el.style.display = 'block';
  el.innerHTML = '<b>Babel Compile Error:</b><br>' + e.message + '<br><br>';
  if (e.loc) {
    el.innerHTML += '<b>At line:</b> ' + e.loc.line + ', col: ' + e.loc.column + '<br>';
  }
  console.error('Full error:', e);
}
</script>
</body>
</html>
